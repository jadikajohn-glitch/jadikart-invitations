  if (typeof s === 'string' && vars) s = s.replace(/\{(\w+)\}/g, function (_, n) { return vars[n] != null ? vars[n] : ''; });

}

function fmtDateSeule(iso) { // "2026-12-12" (date sans heure)

  return s.charAt(0).toUpperCase() + s.slice(1);
}
function fmtDateHeure(iso, opts) {
  if (!iso) return null;
  var s = new Intl.DateTimeFormat('fr-FR', Object.assign({ timeZone: CFG.FUSEAU }, opts)).format(new Date(iso));
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function fmtQuand(iso) {
  if (!iso) return t('heure_a_definir');
  return fmtDateHeure(iso, { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }).replace(' à ', ' · ').replace(':', ' h ');

   ===================================================================== */
function rpc(fonction, corps, delaiMs) {
  var ctrl = ('AbortController' in window) ? new AbortController() : null;
  var minuterie = ctrl ? setTimeout(function () { ctrl.abort(); }, delaiMs || 15000) : null;
  return fetch(CFG.SUPABASE_URL + '/rest/v1/rpc/' + fonction, {
    method: 'POST',
    headers: { 'apikey': CFG.CLE_PUBLIQUE, 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify(corps),
    signal: ctrl ? ctrl.signal : undefined,
    cache: 'no-store'
  }).then(function (r) {
    if (minuterie) clearTimeout(minuterie);
    if (!r.ok) { var e = new Error('http ' + r.status); e.http = r.status; throw e; }
    return r.json();
  }, function (e) { if (minuterie) clearTimeout(minuterie); e.reseau = true; throw e; });
}
function avecReessais(fn, essais) {
  return fn().catch(function (e) {
    if (essais <= 0 || !(e.reseau || e.http >= 500)) throw e;
    return new Promise(function (ok) { setTimeout(ok, 1200); }).then(function () { return avecReessais(fn, essais - 1); });
  });
}

  }

  h += (limite ? '<p class="echeance">' + icone('horloge') + esc(t('repondre_avant', { d: limite })) + '</p>' : '');
  h += '<p class="intro">' + esc(t('reponse_intro')) + '</p>';
  h += '<form id="form-reponse" novalidate>';
  D.evenements.forEach(function (e, idx) { h += blocEvenementHtml(e, idx); });
  h += '<details class="pratique"' + (INFOS.regimes || INFOS.transport || INFOS.logement ? ' open' : '') + '><summary>' + esc(t('pratique')) + '</summary><div class="corps">' +
         '<div class="champ"><label for="regimes">' + esc(t('regimes')) + '</label><input type="text" id="regimes" maxlength="300" autocomplete="off" placeholder="' + esc(t('regimes_ph')) + '" value="' + esc(INFOS.regimes) + '"></div>' +
         '<label class="case"><input type="checkbox" id="transport"' + (INFOS.transport ? ' checked' : '') + '>' + esc(t('transport')) + '</label>' +
         '<label class="case"><input type="checkbox" id="logement"' + (INFOS.logement ? ' checked' : '') + '>' + esc(t('logement')) + '</label>' +
       '</div></details>';
  h += '<p class="consentement">' + esc(t('consentement')) + '</p>';
  h += '<button class="btn btn-plein btn-large" type="submit" id="btn-envoyer">' + esc(t('envoyer')) + '</button>';
  h += '<div class="alerte erreur" id="msg-erreur" role="alert" hidden></div>';
  h += '<div class="alerte info" id="msg-attente" role="status"' + (stock.lire(CLE_ATTENTE) ? '' : ' hidden') + '>' + esc(t('en_attente_envoi')) + '</div>';
  h += '</form>';
  z.innerHTML = h;
  brancherFormulaire();
}

function blocEvenementHtml(e, idx) {
  var c = CHOIX[e.id], total = D.invite.total, nom = 'p-' + idx;
  var h = '<fieldset class="rep-ev" data-ev="' + esc(e.id) + '">' +
            '<legend>' + icone(e.type) + esc(e.titre || t('type.' + e.type)) + '</legend>' +
            '<div class="choix">' +
              '<label><input type="radio" name="' + nom + '" value="oui"' + (c.present === true ? ' checked' : '') + '><span class="oui">' + esc(t('present')) + '</span></label>' +
              '<label><input type="radio" name="' + nom + '" value="non"' + (c.present === false ? ' checked' : '') + '><span class="non">' + esc(t('absent')) + '</span></label>' +
            '</div>' +
            '<div class="detail"' + (c.present === true ? '' : ' hidden') + '>';
  if (total > 1) {
    h += '<div class="compteur"><span class="lib" id="lib-nb-' + idx + '">' + esc(t('nb_presents')) + '</span>' +
           '<span class="ctrl"><button type="button" class="moins" aria-label="Une personne de moins">−</button>' +
           '<output aria-labelledby="lib-nb-' + idx + '" aria-live="polite"><span class="v">' + c.nb + '</span><br><small>' + esc(t('sur', { n: total })) + '</small></output>' +
           '<button type="button" class="plus" aria-label="Une personne de plus">+</button></span></div>';
  }
  h += '<div class="champ"><span class="lib">' + esc(t('prenoms')) + ' <span class="aide">' + esc(t('prenoms_aide')) + '</span></span><div class="prenoms"></div></div>';
  h += '<div class="champ"><label for="msg-' + idx + '">' + esc(t('message')) + ' <span class="aide">' + esc(t('message_aide')) + '</span></label><textarea id="msg-' + idx + '" maxlength="1000" rows="2"></textarea></div>';
  h += '</div>';
  if (idx === 0 && D.evenements.length > 1) h += '<button type="button" class="lien-texte" id="meme-partout">' + esc(t('meme_reponse')) + '</button>';
  h += '</fieldset>';
  return h;
}

function rendrePrenoms(fs) {
  var id = fs.getAttribute('data-ev'), c = CHOIX[id], zone = $('.prenoms', fs);
  var nb = D.invite.total > 1 ? c.nb : 1, h = '';
  for (var k = 0; k < nb; k++) {
    h += '<input type="text" maxlength="60" autocomplete="off" aria-label="' + esc(t('prenom_n', { n: k + 1 })) + '" placeholder="' + esc(t('prenom_n', { n: k + 1 })) + '" value="' + esc(c.prenoms[k] || '') + '">';
  }
  zone.innerHTML = h;
  $$('input', zone).forEach(function (inp, k) {
    inp.addEventListener('input', function () { c.prenoms[k] = inp.value; sauverBrouillon(); });
  });
  var moins = $('.moins', fs), plus = $('.plus', fs);
  if (moins) { moins.disabled = c.nb <= 1; plus.disabled = c.nb >= D.invite.total; $('.v', fs).textContent = c.nb; }
}

function brancherFormulaire() {
  $$('.rep-ev').forEach(function (fs) {
    var id = fs.getAttribute('data-ev'), c = CHOIX[id];
    $('textarea', fs).value = c.message || '';
    $('textarea', fs).addEventListener('input', function (ev) { c.message = ev.target.value; sauverBrouillon(); });
    $$('input[type=radio]', fs).forEach(function (r) {
      r.addEventListener('change', function () {
        c.present = r.value === 'oui';
        if (c.present && (!c.nb || c.nb < 1)) c.nb = D.invite.total;
        $('.detail', fs).hidden = !c.present;
        sauverBrouillon(); cacherErreur();
      });
    });
    var moins = $('.moins', fs), plus = $('.plus', fs);
    if (moins) {
      moins.addEventListener('click', function () { if (c.nb > 1) { c.nb--; c.prenoms = c.prenoms.slice(0, c.nb); rendrePrenoms(fs); sauverBrouillon(); } });
      plus.addEventListener('click', function () { if (c.nb < D.invite.total) { c.nb++; rendrePrenoms(fs); sauverBrouillon(); } });
    }
    rendrePrenoms(fs);
  });
  var meme = $('#meme-partout');
  if (meme) meme.addEventListener('click', function () {
    var premier = CHOIX[D.evenements[0].id];
    if (premier.present === null) { montrerErreur(t('erreur_repondre_tout', { l: D.evenements[0].titre })); return; }
    D.evenements.slice(1).forEach(function (e) { CHOIX[e.id] = { present: premier.present, nb: premier.nb, prenoms: premier.prenoms.slice(), message: CHOIX[e.id].message || '' }; });
    sauverBrouillon(); rendreZoneReponse();
  });
  $('#regimes').addEventListener('input', function (e) { INFOS.regimes = e.target.value; sauverBrouillon(); });
  $('#transport').addEventListener('change', function (e) { INFOS.transport = e.target.checked; sauverBrouillon(); });
  $('#logement').addEventListener('change', function (e) { INFOS.logement = e.target.checked; sauverBrouillon(); });
  $('#form-reponse').addEventListener('submit', function (ev) { ev.preventDefault(); envoyer(); });
}

function resumeHtml() {
  var h = '<ul class="resume">';
  D.evenements.forEach(function (e) {
    var r = e.reponse;
    var val = !r ? '—' : (r.present
      ? esc(t('oui_n', { p: tPersonnes(r.nb) })) + ((r.prenoms || []).length ? '<small>' + esc(r.prenoms.join(', ')) + '</small>' : '')
      : esc(t('non')));
    h += '<li><span class="ev-nom">' + esc(e.titre || t('type.' + e.type)) + '</span><span class="val' + (r && !r.present ? ' non' : '') + '">' + val + '</span></li>';
  });
  return h + '</ul>';
}

function montrerErreur(txt) { var e = $('#msg-erreur'); if (!e) return; e.textContent = txt; e.hidden = false; e.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
function cacherErreur() { var e = $('#msg-erreur'); if (e) e.hidden = true; }

/* =====================================================================
   6. ENVOI DE LA RÉPONSE (avec file d'attente hors ligne)
   ===================================================================== */
function construireEnvoi() {
  var manque = D.evenements.filter(function (e) { return CHOIX[e.id].present === null; });
  if (manque.length) return { erreur: t('erreur_repondre_tout', { l: manque.map(function (e) { return e.titre; }).join(', ') }) };
  var total = D.invite.total;
  var reponses = D.evenements.map(function (e) {
    var c = CHOIX[e.id], nb = c.present ? (total > 1 ? c.nb : 1) : 0;
    if (c.present && (nb < 1 || nb > total)) return null;
    return { evenement_id: e.id, present: c.present, nb: nb,
             prenoms: c.present ? c.prenoms.slice(0, nb).map(function (p) { return String(p || '').trim(); }).filter(Boolean) : [],
             message: (c.message || '').trim() };
  });
  if (reponses.indexOf(null) >= 0) return { erreur: t('err.nombre_invalide', { max: total }) };
  return { corps: { p_code: CODE, p_reponses: reponses, p_infos: { regimes: (INFOS.regimes || '').trim(), transport: !!INFOS.transport, logement: !!INFOS.logement } } };
}

function appliquerLocalement(corps) {
  var maintenant = new Date().toISOString();
  corps.p_reponses.forEach(function (r) {
    var e = D.evenements.filter(function (x) { return x.id === r.evenement_id; })[0];
    if (e) e.reponse = { present: r.present, nb: r.nb, prenoms: r.prenoms, le: maintenant };
  });
}

function envoyer() {
  cacherErreur();
  var p = construireEnvoi();
  if (p.erreur) { montrerErreur(p.erreur); return; }
  var btn = $('#btn-envoyer'); btn.disabled = true; btn.textContent = t('envoi');

  if (DEMO) {  // aucun appel réseau, rien n'est enregistré
    setTimeout(function () { appliquerLocalement(p.corps); EDITION = false; rendreZoneReponse(); var s = $('#zone-reponse .alerte.succes'); if (s) s.insertAdjacentHTML('beforeend', '<br><em>' + esc(t('merci_demo')) + '</em>'); }, 300);
    return;
  }
  rpc('soumettre_reponse', p.corps).then(function (res) {
    if (res && res.ok) {
      stock.effacer(CLE_ATTENTE); stock.effacer(CLE_BROUILLON);
      appliquerLocalement(p.corps); stock.ecrire(CLE_CACHE, D);
      EDITION = false; rendreZoneReponse();
      $('#zone-reponse').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
      btn.disabled = false; btn.textContent = t('envoyer');
      var code = (res && res.erreur) || 'inattendue';
      montrerErreur(t('err.' + code, { max: res && res.max }) || t('err.inattendue'));
      if (code === 'annulee' || code === 'inconnue') setTimeout(demarrer, 2500);
    }
  }).catch(function (e) {
    btn.disabled = false; btn.textContent = t('envoyer');
    if (e.reseau || e.http >= 500) {      // réseau coupé ou serveur indisponible : on garde la réponse
      stock.ecrire(CLE_ATTENTE, p.corps);
      $('#msg-attente').hidden = false;
    } else { montrerErreur(t('err.inattendue')); }
  });
}

function envoyerAttente() {
  var corps = stock.lire(CLE_ATTENTE);
  if (!corps || DEMO || !navigator.onLine) return;
  rpc('soumettre_reponse', corps).then(function (res) {
    if (res && res.ok) {
      stock.effacer(CLE_ATTENTE); stock.effacer(CLE_BROUILLON);
      if (D) { appliquerLocalement(corps); stock.ecrire(CLE_CACHE, D); EDITION = false; rendreZoneReponse();
        var s = $('#zone-reponse .alerte.succes'); if (s) s.insertAdjacentHTML('beforeend', '<br>' + esc(t('envoi_differe_ok'))); }
    } else if (res && res.erreur) {
      stock.effacer(CLE_ATTENTE);   // refus définitif (délai, annulation…) : on informe
      if (D) { var a = $('#msg-attente'); if (a) a.hidden = true; montrerErreur(t('err.' + res.erreur, { max: res.max }) || t('err.inattendue')); }
    }
  }).catch(function () { /* toujours hors ligne : on réessaiera */ });
}

/* =====================================================================
   7. RÉGLAGES (lisibilité, thème)
   ===================================================================== */
function prefs() { return stock.lire('preferences') || {}; }
function themeEffectif() { var p = prefs(); return p.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
function reglagesHtml() {
  var p = prefs(), sombre = themeEffectif() === 'dark';
  return '<div class="reglages" role="group" aria-label="Affichage">' +
           '<button type="button" data-r="grand" aria-pressed="' + !!p.grand + '">A+ ' + esc(t('grands_caracteres')) + '</button>' +
           '<button type="button" data-r="contraste" aria-pressed="' + !!p.contraste + '">' + esc(t('contraste')) + '</button>' +
           '<button type="button" data-r="theme" aria-pressed="false">' + esc(sombre ? t('theme_clair') : t('theme_sombre')) + '</button>' +
         '</div>' +
         '<p class="pied">' + esc(t('signature', { s: CFG.SIGNATURE })) + '</p>';
}
function brancherReglages() {
  $$('.reglages button').forEach(function (b) {
    b.addEventListener('click', function () {
      var p = prefs(), r = b.getAttribute('data-r'), h = document.documentElement;
      if (r === 'theme') { p.theme = themeEffectif() === 'dark' ? 'light' : 'dark'; h.setAttribute('data-theme', p.theme); b.textContent = p.theme === 'dark' ? t('theme_clair') : t('theme_sombre'); }
      else { p[r] = !p[r]; h.setAttribute(r === 'grand' ? 'data-grand' : 'data-contraste', p[r] ? '1' : '0'); b.setAttribute('aria-pressed', String(p[r])); }
      stock.ecrire('preferences', p);
    });
  });
}

/* =====================================================================
   8. DÉMARRAGE
   ===================================================================== */
function afficher(donnees, depuisCache) {
  D = donnees;
  if (D.mariage && TEXTES[D.mariage.langue]) LANGUE = params.get('lang') && TEXTES[params.get('lang')] ? params.get('lang') : D.mariage.langue;
  document.documentElement.lang = LANGUE;
  if (D.etat === 'annulee') { stock.effacer(CLE_CACHE); return rendreEtat('annulee'); }
  if (D.etat !== 'ok') { stock.effacer(CLE_CACHE); return rendreEtat('inconnue'); }
  appliquerTheme(D.mariage && D.mariage.theme);
  definirDemo(MODE_DEMO || !!D.invite.demo);
  initialiserChoix();
  rendreInvitation();
  bandeauHorsLigne(!!depuisCache);
}

function demarrer() {
  if (!CODE) {
    if (MODE_DEMO) { definirDemo(true); return afficher(donneesDemo(), false); }
    return rendreEtat('sans_lien');
  }
  if (!/^[a-z0-9-]{3,80}$/.test(CODE)) return rendreEtat('inconnue');
  var cache = stock.lire(CLE_CACHE);
  if (cache && cache.etat === 'ok') afficher(cache, false);  // affichage immédiat, même sans réseau
  avecReessais(function () { return rpc('get_invitation', { p_code: CODE }); }, 2).then(function (donnees) {
    if (donnees && donnees.etat === 'ok' && !(donnees.invite.demo || MODE_DEMO)) stock.ecrire(CLE_CACHE, donnees);
    // Ne pas écraser une saisie en cours si rien n'a changé côté serveur
    if (cache && D && EDITION && $('#form-reponse') && JSON.stringify(cache) === JSON.stringify(donnees)) { bandeauHorsLigne(false); return; }
    afficher(donnees, false);
    envoyerAttente();
  }).catch(function () {
    if (cache && cache.etat === 'ok') bandeauHorsLigne(true);
    else rendreEtat('reseau');
  });
}

window.addEventListener('online', function () { bandeauHorsLigne(false); envoyerAttente(); });
window.addEventListener('offline', function () { if (D && D.etat === 'ok') bandeauHorsLigne(true); });
demarrer();
})();
</script>

<style>

*, *::before, *::after { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }

/* Barre du haut */

.barre button { background: transparent; border: 1px solid rgba(255,255,255,.35); color: inherit; border-radius: 10px; min-height: 2.5rem; padding: .35rem .7rem; font-size: .85rem; font-weight: 600; cursor: pointer; }

/* Onglets (barre du bas sur téléphone) */
.onglets { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--ligne); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom); }

}

.entete-section { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .6rem; margin-top: 1.2rem; }
.grille-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: .6rem; margin-top: 1rem; }
.stat { background: var(--surface); border: 1px solid var(--ligne); border-radius: 14px; padding: .8rem .9rem; }
.stat b { display: block; font-size: 1.7rem; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--vert); }
.stat span { font-size: .82rem; color: var(--encre-2); font-weight: 500; }
.stat.alerte b { color: var(--rouge); }
table.donnees { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.donnees th, table.donnees td { text-align: left; padding: .55rem .4rem; border-bottom: 1px solid var(--ligne); vertical-align: top; }
table.donnees th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--encre-2); font-weight: 600; }

.b-a_envoyer { background: var(--orange-fond); color: var(--orange); }

.alertes { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; }

.salle { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: .7rem; margin-top: .8rem; }

dialog { border: 0; border-radius: 18px; padding: 0; width: min(36rem, calc(100vw - 24px)); max-height: calc(100vh - 32px); background: var(--surface); color: var(--encre); box-shadow: 0 20px 60px rgba(0,0,0,.3); }

<script>
(function () {
'use strict';
var CFG = window.CONFIG;

/* =====================================================================
   1. UTILITAIRES
   ===================================================================== */
function $(s, e) { return (e || document).querySelector(s); }
function $$(s, e) { return Array.prototype.slice.call((e || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
// Même règle que la fonction SQL normaliser() : minuscules, sans accents, sans ponctuation
function norm(t) { return String(t || '').toLowerCase().replace(/œ/g, 'oe').replace(/æ/g, 'ae').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
var stock = {
  lire: function (k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  ecrire: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  effacer: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function pluriel(n, un, plusieurs) { return n + ' ' + (n > 1 ? plusieurs : un); }
function fmtDate(iso) { if (!iso) return 'Date à définir'; var s = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }).format(new Date(iso + 'T12:00:00Z')); return s.charAt(0).toUpperCase() + s.slice(1); }
function fmtDH(iso) { if (!iso) return 'Heure à définir'; return new Intl.DateTimeFormat('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: CFG.FUSEAU }).format(new Date(iso)); }
function versChampLocal(iso) { // ISO → "AAAA-MM-JJTHH:MM" à l'heure de Lubumbashi
  if (!iso) return '';
  var p = {}; new Intl.DateTimeFormat('en-CA', { timeZone: CFG.FUSEAU, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date(iso)).forEach(function (x) { p[x.type] = x.value; });
  return p.year + '-' + p.month + '-' + p.day + 'T' + p.hour + ':' + p.minute;
}
function depuisChampLocal(v) { return v ? v + ':00' + CFG.DECALAGE : null; }
// Téléphone : garde chiffres et +, convertit 0XXXXXXXXX en +243XXXXXXXXX
function normTel(t) {
  var s = String(t || '').replace(/[^0-9+]/g, '');
  if (!s) return '';
  if (s.indexOf('00') === 0) s = '+' + s.slice(2);
  if (s.charAt(0) === '0') s = '+' + CFG.INDICATIF + s.slice(1);
  if (s.charAt(0) !== '+' && s.length >= 11) s = '+' + s;
  return s;
}
function telValide(t) { return /^\+[0-9]{9,15}$/.test(t); }
function lienWa(num, texte) { var n = String(num || '').replace(/[^0-9]/g, ''); return 'https://wa.me/' + n + '?text=' + encodeURIComponent(texte); }
function lienInvite(i) { return location.origin + location.pathname.replace(/admin\.html$/, '').replace(/\/?$/, '/') + '?i=' + i.code; }
function copier(texte) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(texte).then(function () { toast('Lien copié'); }, function () { copierSecours(texte); });
  copierSecours(texte);
}
function copierSecours(texte) { var t = document.createElement('textarea'); t.value = texte; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast('Lien copié'); } catch (e) { toast('Copie impossible : ' + texte, { erreur: true }); } t.remove(); }
function telecharger(nom, contenu, type) {
  var b = new Blob([contenu], { type: type }); var a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = nom; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
var ICO = {
  wa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-3.8A8 8 0 1 1 8 19z"/><path d="M9 9.2c0 3 2.6 5.8 5.8 5.8l1.2-1.4-1.9-1-.9.9c-1-.4-2.2-1.6-2.6-2.6l.9-.9-1-1.9z"/></svg>',
  lien: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  maj: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg>'
};

/* ---------- Notifications et fenêtres ---------- */
function toast(msg, o) {
  o = o || {};
  var d = document.createElement('div'); d.className = 'toast' + (o.erreur ? ' erreur' : ''); d.setAttribute('role', o.erreur ? 'alert' : 'status');
  d.innerHTML = '<span>' + esc(msg) + '</span>' + (o.annuler ? '<button type="button">Annuler</button>' : '');
  $('#toasts').appendChild(d);
  while ($('#toasts').children.length > 2) $('#toasts').firstChild.remove();   // 2 notifications au maximum
  var fini = false, fin = function () { if (!fini) { fini = true; d.remove(); } };
  if (o.annuler) $('button', d).addEventListener('click', function () { fin(); o.annuler(); });
  setTimeout(fin, o.duree || (o.annuler ? 8000 : o.erreur ? 7000 : 3200));
}
var FEN = $('#fenetre');
function ouvrir(titre, corps, pied) {
  $('#fenetre-contenu').innerHTML = '<div class="fen-tete"><h2>' + esc(titre) + '</h2><button class="fermer" type="button" aria-label="Fermer">×</button></div>' +
    '<div class="fen-corps">' + corps + '</div>' + (pied ? '<div class="fen-pied">' + pied + '</div>' : '');
  $('.fermer', FEN).addEventListener('click', fermer);
  if (!FEN.open) FEN.showModal();
  return $('#fenetre-contenu');
}
function fermer() { if (FEN.open) FEN.close(); }
FEN.addEventListener('cancel', function () { /* Échap ferme */ });
// Confirmation : dit exactement ce qui va se passer. Renvoie une promesse booléenne.
function confirmer(titre, html, libelle, danger) {
  return new Promise(function (ok) {
    var dlg = document.createElement('dialog');
    dlg.innerHTML = '<div class="fen"><div class="fen-tete"><h2>' + esc(titre) + '</h2></div><div class="fen-corps">' + html + '</div>' +
      '<div class="fen-pied"><button class="btn" type="button" data-r="0">Annuler</button><button class="btn btn-plein' + (danger ? ' btn-danger' : '') + '" type="button" data-r="1">' + esc(libelle || 'Confirmer') + '</button></div></div>';
    document.body.appendChild(dlg); dlg.showModal();
    var rep = false;
    $$('button', dlg).forEach(function (b) { b.addEventListener('click', function () { rep = b.getAttribute('data-r') === '1'; dlg.close(); }); });
    dlg.addEventListener('close', function () { dlg.remove(); ok(rep); });
  });
}

/* =====================================================================
   2. CONNEXION (Supabase Auth, lien magique ou code) ET ACCÈS AUX DONNÉES
   ===================================================================== */
var CLE_SESSION = 'admin-session';
function session() { return stock.lire(CLE_SESSION); }
function garderSession(s) {
  stock.ecrire(CLE_SESSION, { access_token: s.access_token, refresh_token: s.refresh_token,
    expires_at: s.expires_at || Math.floor(Date.now() / 1000) + Number(s.expires_in || 3600), email: s.user && s.user.email || (session() || {}).email });
}
function authFetch(chemin, corps, jeton) {
  var h = { 'apikey': CFG.CLE_PUBLIQUE, 'Content-Type': 'application/json' };
  if (jeton) h.Authorization = 'Bearer ' + jeton;
  return fetch(CFG.SUPABASE_URL + '/auth/v1/' + chemin, { method: corps ? 'POST' : 'GET', headers: h, body: corps ? JSON.stringify(corps) : undefined })
    .then(function (r) { return r.text().then(function (t) { var j = {}; try { j = t ? JSON.parse(t) : {}; } catch (e) {} if (!r.ok) { var e2 = new Error(j.msg || j.error_description || j.message || ('Erreur ' + r.status)); e2.status = r.status; throw e2; } return j; }); });
}
var rafraichissement = null;
function rafraichir() {
  var s = session(); if (!s) return Promise.reject(new Error('session'));
  if (!rafraichissement) rafraichissement = authFetch('token?grant_type=refresh_token', { refresh_token: s.refresh_token })
    .then(function (n) { garderSession(n); rafraichissement = null; return n.access_token; }, function (e) { rafraichissement = null; throw e; });
  return rafraichissement;
}
function jeton() {
  var s = session(); if (!s) return Promise.reject(new Error('session'));
  if ((s.expires_at || 0) - 60 < Date.now() / 1000) return rafraichir();
  return Promise.resolve(s.access_token);
}
// Appel REST/RPC avec la session de l'utilisateur (le RLS de la base s'applique).
function api(chemin, o, dejaReessaye) {
  o = o || {};
  return jeton().then(function (j) {
    var h = { 'apikey': CFG.CLE_PUBLIQUE, 'Authorization': 'Bearer ' + j, 'Content-Type': 'application/json', 'Accept': 'application/json' };
    if (o.methode && o.methode !== 'GET') h.Prefer = 'return=representation';
    return fetch(CFG.SUPABASE_URL + '/rest/v1/' + chemin, { method: o.methode || 'GET', headers: h, body: o.corps !== undefined ? JSON.stringify(o.corps) : undefined, cache: 'no-store' });
  }).then(function (r) {
    if (r.status === 401 && !dejaReessaye) return rafraichir().then(function () { return api(chemin, o, true); });
    return r.text().then(function (t) {
      var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
      if (!r.ok) { var e = new Error((j && j.message) || ('Erreur ' + r.status)); e.code = j && j.code; e.status = r.status; throw e; }
      return j;
    });
  }, function (e) { if (e.message === 'session') throw e; var e2 = new Error('Connexion impossible. Vérifiez le réseau puis réessayez.'); e2.reseau = true; throw e2; });
}
function rpc(fn, args) { return api('rpc/' + fn, { methode: 'POST', corps: args || {} }); }
function filtre(champs) { return Object.keys(champs).map(function (k) { return k + '=eq.' + encodeURIComponent(champs[k]); }).join('&'); }
function inserer(table, lignes) { return api(table, { methode: 'POST', corps: lignes }); }
function modifier(table, f, champs) { return api(table + '?' + filtre(f), { methode: 'PATCH', corps: champs }); }
function supprimer(table, f) { return api(table + '?' + filtre(f), { methode: 'DELETE' }); }
function messageErreur(e) {
  var m = (e && e.message) || '';
  if (e && e.code === '23505') return /Doublon/.test(m) ? m : 'Ce nom existe déjà (doublon). Précisez-le, par exemple « Couple Manu (famille 2) ».';
  if (e && e.code === '23514') return 'Valeur refusée : vérifiez le téléphone (chiffres seulement, 8 à 20) et les nombres de personnes.';
  if (e && (e.code === '42501' || /Accès refusé|autoris/.test(m))) return /autoris/.test(m) ? m : 'Action non autorisée pour votre rôle.';
  return m || 'Erreur inattendue.';
}
function echec(e) { if (e && e.message === 'session') return afficherConnexion(); toast(messageErreur(e), { erreur: true }); throw e; }

/* =====================================================================
   3. ÉTAT
   ===================================================================== */
var S = { mariages: [], m: null, role: null, ev: [], tables: [], invites: [], rep: {}, onglet: 'apercu', filtres: { q: '', statut: '', table: '' }, choisi: null, membres: null };
var GROUPES = { famille_1: null, famille_2: null, amis: 'Amis', collegues: 'Collègues', eglise: 'Église', autres: 'Autres' };
function nomGroupe(g) { if (g === 'famille_1') return 'Famille de ' + (S.m ? S.m.marie_1 : '1'); if (g === 'famille_2') return 'Famille de ' + (S.m ? S.m.marie_2 : '2'); return GROUPES[g] || g; }
var STATUTS = { a_envoyer: 'À envoyer', envoyee: 'Envoyée', confirmee: 'Confirmée', partielle: 'Partielle', declinee: 'Déclinée', annulee: 'Annulée', en_attente: "Liste d'attente" };
var TYPES = { civil: 'Cérémonie civile', religieux: 'Cérémonie religieuse', soiree: 'Soirée', autre: 'Autre' };
function gestion() { return S.role === 'admin' || S.role === 'organisateur'; }
function admin() { return S.role === 'admin'; }
function pers(i) { return i.adultes + i.enfants; }
function compte(i) { return i.statut !== 'annulee'; }           // compte dans les places
function reel(i) { return i.statut !== 'annulee' && !i.demo; }  // compte dans les statistiques
function tableDe(id) { return S.tables.filter(function (t) { return t.id === id; })[0] || null; }
function evDe(id) { return S.ev.filter(function (e) { return e.id === id; })[0] || null; }
function soiree() { return S.ev.filter(function (e) { return e.type === 'soiree'; })[0] || S.ev[S.ev.length - 1] || null; }
function occupation(t) {
  var dans = S.invites.filter(function (i) { return i.table_id === t.id && compte(i); });
  var prevues = dans.reduce(function (s, i) { return s + pers(i); }, 0);
  var so = soiree(), conf = dans.reduce(function (s, i) { var r = so && S.rep[i.id] && S.rep[i.id][so.id]; return s + (r && r.present ? r.nb_personnes : 0); }, 0);
  return { invites: dans, prevues: prevues, confirmees: conf, depasse: prevues > t.capacite };
}

function chargerMariages() {
  return rpc('mes_mariages').then(function (l) { S.mariages = l || []; });
}
function chargerDonnees() {
  return rpc('admin_donnees', { p_mariage: S.m.id }).then(function (d) {
    if (!d || !d.mariage) throw new Error('Mariage introuvable ou accès retiré.');
    S.m = d.mariage; S.role = d.role; S.ev = d.evenements; S.tables = d.tables; S.invites = d.invites; S.rep = {};
    d.reponses.forEach(function (r) { (S.rep[r.invite_id] = S.rep[r.invite_id] || {})[r.evenement_id] = r; });
    S.chargeLe = new Date();
  });
}
function recharger() { return chargerDonnees().then(rendre).catch(echec); }

/* =====================================================================
   4. ÉCRANS
   ===================================================================== */
function afficherConnexion(msg) {
  stock.effacer(CLE_SESSION);
  $('#barre').hidden = true; $('#onglets').hidden = true; $('#vue').hidden = true; $('#ecran-connexion').hidden = false;
  $('#form-email').hidden = false; $('#form-code').hidden = true; $('#code').value = '';
  var m = $('#msg-connexion'); m.hidden = !msg; m.textContent = msg || '';
}
function afficherApp() { $('#ecran-connexion').hidden = true; $('#barre').hidden = false; $('#vue').hidden = false; }

function ecranMariages() {
  S.m = null; afficherApp(); $('#onglets').hidden = true;
  $('#barre-titre').textContent = 'Mes mariages'; $('#barre-sous').textContent = (session() || {}).email || ''; $('#btn-mariages').textContent = 'Déconnexion';
  var h = '<div class="entete-section"><h1>Mes mariages</h1>' + (S.peutCreer ? '<button class="btn btn-plein" id="nouveau-mariage" type="button">' + ICO.plus + 'Nouveau mariage</button>' : '') + '</div>';
  if (!S.mariages.length) {
    h += '<div class="carte"><p style="margin:0">Aucun mariage pour ce compte.</p><p class="compte">' +
         (S.peutCreer ? 'Créez votre premier mariage avec le bouton ci-dessus.' : 'Demandez à l\'administrateur du mariage de vous ajouter avec l\'adresse <b>' + esc((session() || {}).email || '') + '</b>.') + '</p></div>';
  }
  h += '<ul class="liste">' + S.mariages.map(function (m) {
    return '<li class="invite"><div class="ligne1"><button class="nom" type="button" data-m="' + esc(m.id) + '">' + esc(m.marie_1 + ' & ' + m.marie_2) + '</button><span class="badge b-envoyee">' + esc({ admin: 'Administrateur', organisateur: 'Organisateur', hote: 'Hôte' }[m.role]) + '</span></div>' +
           '<div class="meta"><span>' + esc(fmtDate(m.date)) + '</span>' + (m.ville ? '<span>' + esc(m.ville) + '</span>' : '') + '</div></li>';
  }).join('') + '</ul>';
  $('#vue').innerHTML = h;
  $$('[data-m]').forEach(function (b) { b.addEventListener('click', function () { ouvrirMariage(b.getAttribute('data-m')); }); });
  var n = $('#nouveau-mariage'); if (n) n.addEventListener('click', formNouveauMariage);
}

function ouvrirMariage(id) {
  S.m = { id: id }; stock.ecrire('admin-mariage', id);
  $('#vue').innerHTML = '<div class="chargement">Chargement…</div>';
  chargerDonnees().then(function () { S.onglet = S.role === 'hote' ? 'apercu' : (S.onglet || 'apercu'); rendre(); }).catch(function (e) { echec(e); });
}

function rendre() {
  if (!S.m) return ecranMariages();
  afficherApp(); $('#onglets').hidden = false; $('#btn-mariages').textContent = 'Mariages';
  $('#barre-titre').textContent = S.m.marie_1 + ' & ' + S.m.marie_2;
  $('#barre-sous').textContent = fmtDate(S.m.date_mariage) + ' · ' + ({ admin: 'Administrateur', organisateur: 'Organisateur', hote: "Hôte d'accueil" }[S.role] || '');
  $$('#onglets button').forEach(function (b) { b.setAttribute('aria-current', b.getAttribute('data-onglet') === S.onglet ? 'page' : 'false'); b.hidden = S.role === 'hote' && ['invites', 'salle', 'reglages'].indexOf(b.getAttribute('data-onglet')) >= 0; });
  ({ apercu: vueApercu, invites: vueInvites, salle: vueSalle, programme: vueProgramme, reglages: vueReglages })[S.onglet]();
}

/* ---------- 4.1 Aperçu ---------- */
function vueApercu() {
  if (S.role === 'hote') {
    $('#vue').innerHTML = '<div class="carte"><h2>Bienvenue</h2><p>Votre rôle est <b>hôte d\'accueil</b>. L\'écran d\'accueil du jour J (scan des QR codes, recherche par nom) sera ajouté à l\'étape E.</p><p class="compte">Pour protéger les invités, les hôtes ne voient jamais les numéros de téléphone.</p></div>';
    return;
  }
  var reels = S.invites.filter(reel), annules = S.invites.filter(function (i) { return i.statut === 'annulee'; });
  var somme = function (l, f) { return l.reduce(function (s, i) { return s + f(i); }, 0); };
  var nbStat = function (st) { return reels.filter(function (i) { return i.statut === st; }).length; };
  var sansTable = reels.filter(function (i) { return !i.table_id; }), sansTel = reels.filter(function (i) { return !i.telephone && !(i.via_relais && S.m.whatsapp_relais); });
  var regimes = reels.filter(function (i) { return i.regimes || S.ev.some(function (e) { var r = S.rep[i.id] && S.rep[i.id][e.id]; return r && r.regimes; }); });
  var places = somme(S.tables, function (t) { return t.capacite; });

  var h = '<div class="entete-section"><h1>Aperçu</h1><div class="actions">' +
          '<button class="btn btn-petit" id="actualiser" type="button">' + ICO.maj + 'Actualiser</button>' +
          '<button class="btn btn-petit btn-plein" id="appliquer" type="button">Appliquer aux statuts</button></div></div>';
  h += '<p class="compte">Données du ' + esc(new Intl.DateTimeFormat('fr-FR', { dateStyle: 'short', timeStyle: 'medium', timeZone: CFG.FUSEAU }).format(S.chargeLe)) + '. « Appliquer aux statuts » met à jour Confirmée / Partielle / Déclinée d\'après les dernières réponses.</p>';
  h += '<div class="grille-stats">' +
    stat(reels.length, 'invitations') + stat(somme(reels, pers), 'personnes invitées') +
    stat(somme(reels, function (i) { return i.adultes; }), 'adultes') + stat(somme(reels, function (i) { return i.enfants; }), 'enfants') +
    stat(nbStat('confirmee'), 'confirmées') + stat(nbStat('partielle'), 'partielles (ex. 1 sur 2)') + stat(nbStat('declinee'), 'déclinées') +
    stat(nbStat('a_envoyer'), 'à envoyer') + stat(nbStat('envoyee'), 'envoyées sans réponse') + stat(annules.length, 'annulées') +
    stat(sansTable.length, 'sans table', sansTable.length > 0) + stat(sansTel.length, 'sans téléphone ni relais', sansTel.length > 0) +
    stat(regimes.length, 'régimes / allergies') + stat(somme(reels.filter(function (i) { return i.table_id; }), pers) + ' / ' + places, 'places occupées') + '</div>';

  // Par événement
  h += '<div class="carte"><h2>Réponses par événement</h2><div class="defile"><table class="donnees"><thead><tr><th>Événement</th><th class="n">Invités</th><th class="n">Présents</th><th class="n">Absents</th><th class="n">Sans réponse</th></tr></thead><tbody>';
  S.ev.forEach(function (e) {
    var conv = reels.filter(function (i) { return i.evenements.indexOf(e.id) >= 0; });
    var pres = 0, abs = 0, sans = 0;
    conv.forEach(function (i) { var r = S.rep[i.id] && S.rep[i.id][e.id]; if (!r) sans += pers(i); else if (r.present) { pres += r.nb_personnes; abs += pers(i) - r.nb_personnes; } else abs += pers(i); });
    h += '<tr><td>' + esc(e.titre) + '</td><td class="n">' + somme(conv, pers) + '</td><td class="n"><b>' + pres + '</b></td><td class="n">' + abs + '</td><td class="n">' + sans + '</td></tr>';
  });
  if (!S.ev.length) h += '<tr><td colspan="5">Aucun événement. Ajoutez-les dans l\'onglet Programme.</td></tr>';
  h += '</tbody></table></div><p class="compte">En personnes. Un couple qui répond « 1 sur 2 » compte 1 présent et 1 absent.</p></div>';

  // Alertes
  h += '<div class="carte"><h2>Points à vérifier</h2><ul class="alertes">' + alertes().map(function (a) { return '<li class="' + a.niv + '">' + a.html + '</li>'; }).join('') + '</ul></div>';
  $('#vue').innerHTML = h;
  $('#actualiser').addEventListener('click', function () { recharger().then(function () { toast('Données actualisées'); }); });
  $('#appliquer').addEventListener('click', function () {
    var b = this; b.disabled = true;

/* ---------- Import en masse ---------- */
function formImport() {
  var c = '<p class="aide" style="margin-top:0">Une ligne par invitation : <b>Nom ; numéro</b>, et si besoin <b>; adultes ; enfants</b>. Exemple :</p>' +
          '<span class="code">Couple Mukendi ; 0991234567 ; 2<br>Maman Thérèse ; ; 1<br>Famille Kasongo ; +243 81 234 5678 ; 2 ; 3</span>' +

          '<div class="champ"><label for="im-table">Table</label><select id="im-table">' + optionsTables('') + '</select></div></div>' +

  var f = ouvrir('Importer une liste', c, '<button class="btn" type="button" id="im-analyser">Vérifier la liste</button><button class="btn btn-plein" type="button" id="im-ok" disabled>Importer</button>');
  var lignes = [];
  function analyser() {
    var existants = {}; S.invites.forEach(function (i) { if (i.statut !== 'annulee') existants[norm(i.nom)] = i.nom; });
    var vus = {};
    lignes = $('#im-texte', f).value.split('\n').map(function (brut, k) {
      if (!brut.trim()) return null;
      var p = brut.split(/[;\t]/).map(function (x) { return x.trim(); });
      var l = { n: k + 1, nom: (p[0] || '').replace(/\s+/g, ' '), telBrut: p[1] || '', telephone: normTel(p[1]), adultes: p[2] ? parseInt(p[2], 10) : 1, enfants: p[3] ? parseInt(p[3], 10) : 0, pb: '' };
      var cle = norm(l.nom);
      if (!l.nom) l.pb = 'Nom vide';
      else if (existants[cle]) l.pb = 'Doublon : « ' + existants[cle] + ' » existe déjà';
      else if (vus[cle]) l.pb = 'Doublon dans la liste (ligne ' + vus[cle] + ')';
      else if (l.telephone && !telValide(l.telephone)) l.pb = 'Téléphone invalide';
      else if (isNaN(l.adultes) || isNaN(l.enfants) || l.adultes < 0 || l.enfants < 0 || l.adultes + l.enfants < 1 || l.adultes + l.enfants > 30) l.pb = 'Nombre de personnes invalide';
      if (cle && !vus[cle]) vus[cle] = l.n;

    if (t) { var o = occupation(t), tot = o.prevues + bons.reduce(function (s, l) { return s + l.adultes + l.enfants; }, 0); if (tot > t.capacite) msg = '<div class="message attention">' + esc(nomTable(t)) + ' aurait ' + tot + ' personnes pour ' + t.capacite + ' places.</div>'; }

      lignes.map(function (l) { return '<tr><td>' + l.n + '</td><td>' + esc(l.nom) + '</td><td>' + esc(l.telephone || (l.telBrut ? l.telBrut : '—')) + '</td><td class="n">' + (l.adultes + l.enfants || '?') + '</td><td class="' + (l.pb ? 'err' : 'ok') + '">' + esc(l.pb || 'OK') + '</td></tr>'; }).join('') +
      '</tbody></table></div><div class="message ' + (bons.length === lignes.length ? 'ok' : 'attention') + '">' + pluriel(bons.length, 'ligne prête', 'lignes prêtes') + (lignes.length - bons.length ? ' · ' + pluriel(lignes.length - bons.length, 'ligne écartée', 'lignes écartées') + ' (non importées)' : '') + '</div>' + msg;

  $('#im-texte', f).addEventListener('input', function () { $('#im-ok', f).disabled = true; });
  $('#im-ok', f).addEventListener('click', function () {
    var b = this, bons = lignes.filter(function (l) { return !l.pb; }), relais = $('#im-relais', f).checked;
    b.disabled = true;
    rpc('importer_invites', { p_mariage: S.m.id, p_evenements: $$('.im-ev:checked', f).map(function (x) { return x.value; }),
      p_lignes: bons.map(function (l) { return { nom: l.nom, telephone: l.telephone, adultes: l.adultes, enfants: l.enfants, groupe: $('#im-groupe', f).value, table_id: $('#im-table', f).value, via_relais: relais && !l.telephone }; }) })
      .then(function (r) { toast(pluriel(r.ajoutes, 'invité importé', 'invités importés')); fermer(); return recharger(); })
      .catch(function (e) { b.disabled = false; $('#im-apercu', f).insertAdjacentHTML('beforeend', '<div class="message erreur">' + esc(messageErreur(e)) + '</div>'); });
  });
}

/* ---------- 4.3 Plan de salle ---------- */
function vueSalle() {
  var tot = S.tables.reduce(function (s, t) { return s + t.capacite; }, 0), occ = 0, dep = 0, pleines = 0;
  S.tables.forEach(function (t) { var o = occupation(t); occ += o.prevues; if (o.depasse) dep++; else if (o.prevues === t.capacite) pleines++; });
  var sans = S.invites.filter(function (i) { return !i.table_id && compte(i); });
  var h = '<div class="entete-section"><h1>Plan de salle</h1>' + (gestion() ? '<div class="actions"><button class="btn btn-petit btn-plein" id="ajout-tables" type="button">' + ICO.plus + 'Tables</button></div>' : '') + '</div>';
  h += '<p class="compte">' + pluriel(S.tables.length, 'table', 'tables') + ' · ' + occ + ' / ' + tot + ' places occupées · ' + pluriel(pleines, 'table pleine', 'tables pleines') + (dep ? ' · <b style="color:var(--rouge)">' + pluriel(dep, 'dépassement', 'dépassements') + '</b>' : '') +
       '. Touchez un invité puis « Placer ici » sur une table (ou glissez-le sur ordinateur). Les invitations annulées ne comptent pas.</p>';
  h += '<div class="bandeau-placement" id="bandeau-placement" hidden><span id="placement-texte"></span><button type="button" id="placement-annuler">Annuler</button></div>';
  h += '<div class="salle" id="salle">' + S.tables.map(carteTable).join('') + '</div>';
  if (!S.tables.length) h += '<div class="carte">Aucune table. ' + (gestion() ? 'Ajoutez-en avec le bouton « Tables ».' : '') + '</div>';
  h += '<div class="carte zone-sans-table table-carte" data-table=""><div class="tete"><div class="info"><b>Sans table</b><small>' + pluriel(sans.length, 'invitation', 'invitations') + ' · ' + pluriel(sans.reduce(function (s, i) { return s + pers(i); }, 0), 'personne', 'personnes') + '</small></div><button class="btn btn-petit placer" type="button" data-placer="">Retirer de sa table</button></div>' +
       '<div class="jetons">' + sans.map(jetonInvite).join('') + '</div></div>';
  $('#vue').innerHTML = h;
  brancherSalle();
  var a = $('#ajout-tables'); if (a) a.addEventListener('click', formTables);
}
function carteTable(t) {
  var o = occupation(t), pct = Math.min(1, o.prevues / t.capacite), C = 2 * Math.PI * 26;
  var cls = o.depasse ? ' depasse' : o.prevues === t.capacite ? ' plein' : '';
  var couleur = o.depasse ? 'var(--rouge)' : o.prevues === t.capacite ? 'var(--ok)' : 'var(--or)';
  var annules = S.invites.filter(function (i) { return i.table_id === t.id && !compte(i); });
  var relais = o.invites.filter(function (i) { return (i.via_relais || !i.telephone) && !i.demo; });
  return '<div class="table-carte' + cls + '" data-table="' + esc(t.id) + '">' +
    '<div class="tete"><div class="rond"><svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26" fill="none" stroke="var(--ligne)" stroke-width="3"/><circle cx="28" cy="28" r="26" fill="none" stroke="' + couleur + '" stroke-width="3" stroke-dasharray="' + (C * pct).toFixed(1) + ' ' + C.toFixed(1) + '" stroke-linecap="round"/></svg>' + esc(t.nom.length > 4 ? t.nom.slice(0, 3) + '…' : t.nom) + '</div>' +
    '<div class="info"><b>' + esc(nomTable(t)) + '</b><small>' + o.prevues + ' / ' + t.capacite + ' places' + (o.depasse ? ' — dépassement !' : o.prevues === t.capacite ? ' — pleine' : ' — ' + (t.capacite - o.prevues) + ' libre(s)') + (soiree() ? ' · ' + o.confirmees + ' confirmé(s)' : '') + '</small></div>' +
    (gestion() ? '<button class="btn btn-petit" type="button" data-edit-table="' + esc(t.id) + '" aria-label="Modifier ' + esc(nomTable(t)) + '">✎</button>' : '') + '</div>' +
    '<div class="jetons">' + o.invites.map(jetonInvite).join('') + annules.map(function (i) { return '<span class="jeton annule" title="Annulée">' + esc(i.nom) + '</span>'; }).join('') + (o.invites.length ? '' : '<small class="aide">Table vide</small>') + '</div>' +
    '<div class="actions"><button class="btn btn-petit placer" type="button" data-placer="' + esc(t.id) + '">Placer ici</button>' +
    (relais.length && gestion() ? '<button class="btn btn-petit" type="button" data-relais-table="' + esc(t.id) + '">' + ICO.wa + 'Envoyer au relais (' + relais.length + ')</button>' : '') + '</div></div>';
}
function jetonInvite(i) { return '<span class="jeton' + (S.choisi === i.id ? ' choisi' : '') + '" draggable="' + gestion() + '" data-jeton="' + esc(i.id) + '" role="button" tabindex="0">' + esc(i.nom) + ' <small>' + pers(i) + '</small></span>'; }
function brancherSalle() {
  var salle = $('#vue');
  function majPlacement() {
    salle.classList.toggle('mode-placement', !!S.choisi);
    var b = $('#bandeau-placement'), i = S.choisi && S.invites.filter(function (x) { return x.id === S.choisi; })[0];
    b.hidden = !i; if (i) $('#placement-texte').textContent = 'Placer « ' + i.nom + ' » (' + pluriel(pers(i), 'personne', 'personnes') + ')';
    $$('.jeton', salle).forEach(function (j) { j.classList.toggle('choisi', j.getAttribute('data-jeton') === S.choisi); });
  }
  if (gestion()) {
    $$('[data-jeton]', salle).forEach(function (j) {
      var choisir = function () { S.choisi = S.choisi === j.getAttribute('data-jeton') ? null : j.getAttribute('data-jeton'); majPlacement(); };
      j.addEventListener('click', choisir);
      j.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choisir(); } });
      j.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', j.getAttribute('data-jeton')); });
    });
    $$('[data-table]', salle).forEach(function (c) {
      c.addEventListener('dragover', function (e) { e.preventDefault(); c.classList.add('cible'); });
      c.addEventListener('dragleave', function () { c.classList.remove('cible'); });
      c.addEventListener('drop', function (e) { e.preventDefault(); c.classList.remove('cible'); deplacer(e.dataTransfer.getData('text/plain'), c.getAttribute('data-table') || null); });
    });
    $$('[data-placer]', salle).forEach(function (b) { b.addEventListener('click', function () { if (S.choisi) deplacer(S.choisi, b.getAttribute('data-placer') || null); }); });
    $$('[data-edit-table]', salle).forEach(function (b) { b.addEventListener('click', function () { formTable(tableDe(b.getAttribute('data-edit-table'))); }); });
    $$('[data-relais-table]', salle).forEach(function (b) { b.addEventListener('click', function () { envoyerRelaisTable(tableDe(b.getAttribute('data-relais-table'))); }); });
    $('#placement-annuler').addEventListener('click', function () { S.choisi = null; majPlacement(); });
  }
  majPlacement();
}
// Déplacement : toujours annoncé, confirmé si la table déborde, annulable.
function deplacer(inviteId, tableId) {
  var i = S.invites.filter(function (x) { return x.id === inviteId; })[0]; if (!i) return;
  if ((i.table_id || null) === (tableId || null)) { S.choisi = null; return vueSalle(); }
  var avant = tableDe(i.table_id), apres = tableDe(tableId);
  var txt = '« ' + i.nom + ' » : ' + (avant ? nomTable(avant) : 'sans table') + ' → ' + (apres ? nomTable(apres) : 'sans table');
  var verif = Promise.resolve(true);
  if (apres) { var o = occupation(apres), tot = o.prevues + (compte(i) ? pers(i) : 0); if (tot > apres.capacite) verif = confirmer('Table complète', '<p>' + esc(nomTable(apres)) + ' aura <b>' + tot + ' personnes pour ' + apres.capacite + ' places</b> si vous y placez « ' + esc(i.nom) + ' » (' + pluriel(pers(i), 'personne', 'personnes') + ').</p>', 'Placer quand même', true); }
  verif.then(function (ok) {
    if (!ok) return;
    var ancien = i.table_id || null;
    i.table_id = tableId || null; S.choisi = null; vueSalle();
    modifier('invites', { id: i.id }, { table_id: tableId || null }).then(function (r) {
      if (!r || !r.length) throw new Error('Action non autorisée pour votre rôle.');
      toast(txt, { annuler: function () { modifier('invites', { id: i.id }, { table_id: ancien }).then(function () { i.table_id = ancien; toast('Déplacement annulé'); vueSalle(); }).catch(echec); } });
    }).catch(function (e) { i.table_id = ancien; vueSalle(); echec(e); });
  });
}
function envoyerRelaisTable(t) {
  if (!S.m.whatsapp_relais) { toast('Aucun numéro relais enregistré (onglet Réglages).', { erreur: true }); return; }
  var l = occupation(t).invites.filter(function (i) { return (i.via_relais || !i.telephone) && !i.demo; });
  var txt = 'Bonjour, voici les invitations au mariage de ' + S.m.marie_1 + ' & ' + S.m.marie_2 + ' pour ' + nomTable(t) + ', à transmettre s\'il vous plaît :\n\n' +
            l.map(function (i) { return '• ' + i.nom + ' (' + pluriel(pers(i), 'personne', 'personnes') + ') :\n' + lienInvite(i); }).join('\n\n');
  window.open(lienWa(S.m.whatsapp_relais, txt), '_blank', 'noopener');
  marquerEnvoyees(l);
}
function formTables() {
  var nums = S.tables.map(function (t) { return parseInt(t.nom, 10); }).filter(function (n) { return !isNaN(n); }), suivant = nums.length ? Math.max.apply(null, nums) + 1 : 1;
  var f = ouvrir('Ajouter des tables', '<div class="trois"><div class="champ"><label for="tb-n">Nombre</label><input type="number" id="tb-n" min="1" max="60" value="' + (S.tables.length ? 1 : 10) + '"></div>' +
    '<div class="champ"><label for="tb-cap">Places par table</label><select id="tb-cap">' + [6, 8, 10, 12].map(function (c) { return '<option' + (c === 10 ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></div>' +
    '<div class="champ"><label for="tb-debut">Numéro de départ</label><input type="number" id="tb-debut" min="1" value="' + suivant + '"></div></div>' +
    '<div class="champ"><label for="tb-nom">Ou un nom unique <span class="aide">(ex. « Table d\'honneur » — remplace la numérotation)</span></label><input type="text" id="tb-nom" maxlength="40"></div><div id="tb-apercu" class="message info"></div>',
    '<button class="btn btn-plein" type="button" id="tb-ok">Ajouter</button>');
  function noms() {
    var nom = $('#tb-nom', f).value.trim(); if (nom) return [nom];
    var n = Math.min(60, parseInt($('#tb-n', f).value, 10) || 0), d = parseInt($('#tb-debut', f).value, 10) || 1, l = [];
    for (var k = 0; k < n; k++) l.push(String(d + k)); return l;
  }
  function ap() { var l = noms(), ex = S.tables.map(function (t) { return t.nom.toLowerCase(); }), conflits = l.filter(function (x) { return ex.indexOf(x.toLowerCase()) >= 0; });
    $('#tb-apercu', f).className = 'message ' + (conflits.length ? 'erreur' : 'info');
    $('#tb-apercu', f).textContent = conflits.length ? 'Ces tables existent déjà : ' + conflits.join(', ') : 'Seront créées : ' + l.map(function (x) { return /^\d+$/.test(x) ? 'Table ' + x : x; }).join(', ') + ' (' + $('#tb-cap', f).value + ' places chacune).';
    $('#tb-ok', f).disabled = !l.length || conflits.length > 0; }
  $$('input,select', f).forEach(function (x) { x.addEventListener('input', ap); }); ap();
  $('#tb-ok', f).addEventListener('click', function () {
    var cap = parseInt($('#tb-cap', f).value, 10), base = S.tables.length;
    this.disabled = true;
    inserer('tables_salle', noms().map(function (n, k) { return { mariage_id: S.m.id, nom: n, capacite: cap, ordre: base + k }; }))
      .then(function (r) { toast(pluriel(r.length, 'table ajoutée', 'tables ajoutées')); fermer(); return recharger(); }).catch(echec);
  });
}
function formTable(t) {

  var f = ouvrir(nomTable(t), '<div class="deux"><div class="champ"><label for="t-nom">Nom</label><input type="text" id="t-nom" maxlength="40" value="' + esc(t.nom) + '"></div>' +
    '<div class="champ"><label for="t-cap">Places</label><input type="number" id="t-cap" min="2" max="20" value="' + t.capacite + '"></div></div><p class="aide">' + o.prevues + ' personne(s) placée(s) actuellement.</p><div class="message erreur" id="t-err" hidden></div>',
    (admin() ? '<button class="btn btn-danger" type="button" id="t-suppr">Supprimer la table</button>' : '') + '<button class="btn btn-plein" type="button" id="t-ok">Enregistrer</button>');
  $('#t-ok', f).addEventListener('click', function () {

    go.then(function (ok) { if (ok) modifier('tables_salle', { id: t.id }, { nom: nom, capacite: cap }).then(function () { toast(nomTable({ nom: nom }) + ' enregistrée'); fermer(); return recharger(); }).catch(function (e) { $('#t-err', f).textContent = /23505/.test(e.code) ? 'Une table porte déjà ce nom.' : messageErreur(e); $('#t-err', f).hidden = false; }); });

      .then(function (ok) { if (ok) supprimer('tables_salle', { id: t.id }).then(function (r) { if (!r || !r.length) throw new Error('Action non autorisée pour votre rôle.'); toast(nomTable(t) + ' supprimée'); fermer(); return recharger(); }).catch(echec); });
  });

/* ---------- 4.4 Programme ---------- */

  var h = '<div class="entete-section"><h1>Programme</h1>' + (gestion() ? '<button class="btn btn-petit btn-plein" id="ajout-ev" type="button">' + ICO.plus + 'Événement</button>' : '') + '</div>';

function exporterCsv() {
  var col = ['Nom', 'Téléphone', 'Relais', 'Groupe', 'Adultes', 'Enfants', 'Table', 'Statut', 'Démo', 'Lien'].concat(S.ev.map(function (e) { return e.titre; })).concat(['Régimes', 'Notes']);
  var cel = function (v) {
    v = String(v == null ? '' : v);
    if (/^[=@\-\t\r]/.test(v) || /^\+[^0-9]/.test(v)) v = "'" + v;   // empêche Excel d'exécuter une formule cachée dans un nom
    return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  };
  var lignes = S.invites.map(function (i) {
    var t = tableDe(i.table_id);
    return [i.nom, i.telephone, i.via_relais ? 'oui' : '', nomGroupe(i.groupe), i.adultes, i.enfants, t ? t.nom : '', STATUTS[i.statut], i.demo ? 'oui' : '', lienInvite(i)]
      .concat(S.ev.map(function (e) { if (i.evenements.indexOf(e.id) < 0) return 'non invité'; var r = S.rep[i.id] && S.rep[i.id][e.id]; return !r ? 'sans réponse' : r.present ? 'présent ' + r.nb_personnes : 'absent'; }))
      .concat([i.regimes, i.notes]).map(cel).join(';');
  });
  telecharger('invites-' + S.m.slug + '.csv', '﻿' + col.map(cel).join(';') + '\n' + lignes.join('\n'), 'text/csv;charset=utf-8');
}

function lireRetourLien() {  // retour du lien magique : #access_token=…&refresh_token=…
  if (!location.hash || location.hash.length < 2) return null;
  var p = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname + location.search);
  if (p.get('error_description')) return { erreur: p.get('error_code') === 'otp_expired' ? 'Ce lien de connexion a expiré ou a déjà été utilisé. Demandez-en un nouveau.' : p.get('error_description') };
  if (p.get('access_token')) return { access_token: p.get('access_token'), refresh_token: p.get('refresh_token'), expires_in: p.get('expires_in'), expires_at: p.get('expires_at') ? Number(p.get('expires_at')) : null };
  return null;
}

function demarrer() {
  var retour = lireRetourLien();
  if (retour && retour.erreur) return afficherConnexion(retour.erreur);
  if (retour) garderSession(retour);
  if (!session()) return afficherConnexion();
  jeton().then(function (j) { return authFetch('user', null, j); }).then(function (u) {
    var s = session(); s.email = u.email; stock.ecrire(CLE_SESSION, s);
    return Promise.all([chargerMariages(), rpc('peut_creer_mariage').then(function (v) { S.peutCreer = !!v; })]);
  }).then(function () {
    var dernier = stock.lire('admin-mariage');
    if (dernier && S.mariages.some(function (m) { return m.id === dernier; })) return ouvrirMariage(dernier);
    if (S.mariages.length === 1) return ouvrirMariage(S.mariages[0].id);
    ecranMariages();
  }).catch(function (e) {
    if (e.reseau) { $('#vue').hidden = false; $('#vue').innerHTML = '<div class="carte">Connexion impossible. Vérifiez le réseau. <button class="btn btn-petit" type="button" onclick="location.reload()">Réessayer</button></div>'; return; }
    afficherConnexion('Votre session a expiré. Reconnectez-vous.');
  });
}
demarrer();
})();
</script>
